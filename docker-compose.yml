version: '3.8'

services:
  telehealth-encounter-documentation-engine:
    build: .
    container_name: telehealth-encounter-documentation-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a persistent, strong AUDIT_SECRET_KEY}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
