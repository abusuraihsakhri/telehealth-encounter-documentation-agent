[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telehealth-encounter-documentation-engine"
version = "2.0.0"
description = "TeleHealth-Audit: Virtual Care CMS Billing & Modality Compliance Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1"]

[project.scripts]
telehealth-encounter-documentation-engine = "telehealth_audit.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/telehealth-encounter-documentation-agent"
Repository = "https://github.com/abusuraihsakhri/telehealth-encounter-documentation-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "telehealth_audit_app"]

[tool.setuptools.packages.find]
include = ["agents*", "telehealth_audit*"]
